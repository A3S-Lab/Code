[package]
name = "a3s-code-node"
version = "8.2.0"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Code"
description = "A3S Code Node.js bindings - Native addon via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
a3s-code-core = { version = "8.2.0", path = "../../core", default-features = false, features = ["headless-search", "s3", "serve"] }
napi = { version = "2", features = ["async", "napi6", "serde-json"] }
napi-derive = "2"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
serde_json = "1.0"
serde = "1.0"
anyhow = "1.0"
async-trait = "0.1"

[build-dependencies]
napi-build = "2"

[features]
# Product SDK builds use the verified, bundled zvec-rust FTS backend by default.
# Minimal embedders can pass --no-default-features and retain the portable
# lexical scorer without compiling or downloading a native library.
default = ["zvec-rust-fts-bundled"]
# Compile the native adapter against a staged, target-matched libzvec_c_api.
zvec-rust-fts = ["a3s-code-core/zvec-rust-fts"]
# Local qualification convenience; release workflows set ZVEC_LIB_DIR to the
# verified artifact staging path instead of relying on an implicit download.
zvec-rust-fts-bundled = ["zvec-rust-fts", "a3s-code-core/zvec-rust-fts-bundled"]
