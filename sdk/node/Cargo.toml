[package]
name = "a3s-code-node"
version = "8.7.0"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Code"
description = "A3S Code Node.js bindings - Native addon via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
a3s-code-core = { version = "8.7.0", path = "../../core", default-features = false }
napi = { version = "2", features = ["async", "napi6", "serde-json"] }
napi-derive = "2"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
serde_json = "1.0"
serde = "1.0"
anyhow = "1.0"
async-trait = "0.1"

[build-dependencies]
napi-build = "2"

[features]
# Thin coding-harness default (`HARNESS-CONV5`). Enable `advanced-harness`,
# `server`, and/or `headless-search` explicitly for product surfaces.
default = ["a3s-vec-fts"]
# Coding-only embeds: `--no-default-features --features a3s-vec-fts`
headless-search = ["a3s-code-core/headless-search"]
s3 = ["a3s-code-core/s3"]
server = ["s3"]
advanced-harness = ["a3s-code-core/advanced-harness"]
a3s-vec-fts = ["a3s-code-core/a3s-vec-fts"]
