[package]
name = "a3s-code-go-bridge"
version = "8.7.0"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Code"
description = "Machine bridge for the A3S Code Go SDK"
publish = false

[lib]
name = "a3s_code_go_bridge"
path = "src/lib.rs"

[[bin]]
name = "a3s-code-go-bridge"
path = "src/main.rs"

[dependencies]
a3s-code-core = { version = "8.7.0", path = "../../../core", default-features = false }
async-trait = "0.1"
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "sync",
    "time",
] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3.10"

[features]
# Thin coding-harness default (`HARNESS-CONV5`). Enable `advanced-harness`,
# `server`, and/or `headless-search` explicitly for product surfaces.
default = ["a3s-vec-fts"]
# Coding-only: `--no-default-features --features a3s-vec-fts`
headless-search = ["a3s-code-core/headless-search"]
# Optional server surfaces.
s3 = ["a3s-code-core/s3"]
server = ["s3"]
# Advanced harness (evaluation/research/state-graph/dynamic-workflow).
advanced-harness = ["a3s-code-core/advanced-harness"]
# Compile the pure-Rust a3s-vec FTS adapter.
a3s-vec-fts = ["a3s-code-core/a3s-vec-fts"]
# Match Core's non-Apple CI surface (no Metal), including Go-side S3/search.
ci-all = [
    "a3s-code-core/ci-all",
    "s3",
    "advanced-harness",
    "headless-search",
]
