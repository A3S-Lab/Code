[package]
name = "a3s-code-py"
version = "8.2.0"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Code"
description = "A3S Code Python bindings - Native Python module via PyO3"

[lib]
name = "a3s_code"
crate-type = ["cdylib"]

[dependencies]
a3s-code-core = { version = "8.2.0", path = "../../core", default-features = false, features = ["headless-search", "s3", "serve"] }
pyo3 = { version = "0.23", features = ["multiple-pymethods"] }
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
serde_json = "1.0"
serde = "1.0"
anyhow = "1.0"
async-trait = "0.1"
num_cpus = "1.16"

[features]
default = ["zvec-rust-fts-bundled"]
# Build one stable-ABI extension for CPython 3.10 and newer.  The limited API
# is forward-compatible with Python 3.14 while keeping the existing PyO3
# surface and avoiding a separate native binary for every minor release.
extension-module = ["pyo3/extension-module", "pyo3/abi3-py310"]
# Compile the native adapter against a staged, target-matched libzvec_c_api.
zvec-rust-fts = ["a3s-code-core/zvec-rust-fts"]
# Local qualification convenience; release workflows set ZVEC_LIB_DIR to the
# verified artifact staging path instead of relying on an implicit download.
zvec-rust-fts-bundled = ["zvec-rust-fts", "a3s-code-core/zvec-rust-fts-bundled"]
