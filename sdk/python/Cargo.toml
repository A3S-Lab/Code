[package]
name = "a3s-code-py"
version = "1.10.0"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/AI45Lab/Code"
description = "A3S Code Python bindings - Native Python module via PyO3"

[lib]
name = "a3s_code"
crate-type = ["cdylib"]

[dependencies]
a3s-code-core = { version = "1.10.0", path = "../../core", features = ["ahp"] }
pyo3 = "0.23"
tokio = { version = "1.35", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
num_cpus = "1.16"

[features]
default = ["ahp"]
ahp = []
extension-module = ["pyo3/extension-module"]
