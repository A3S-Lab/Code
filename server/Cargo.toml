[package]
name = "a3s-code"
version = "0.6.0"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Code"
description = "A3S Code - AI coding agent (depends on a3s-code-core for business logic)"

[lib]
name = "a3s_code"
path = "src/lib.rs"

[[bin]]
name = "a3s-code"
path = "src/main.rs"

[dependencies]
# Core library (all business logic)
a3s-code-core = { version = "0.6", path = "../core" }

# Internal crates
a3s-updater = { version = "0.2", path = "../../updater" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["tonic"] }
opentelemetry-semantic-conventions = "0.13"

[dev-dependencies]
tempfile = "3.10"
