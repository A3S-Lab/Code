[package]
name = "a3s-code-acp"
version = "9.1.3"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
description = "ACP stdio agent bridging a3s-code-core 9.1.3 to the forked grok-build pager"

[[bin]]
name = "a3s-code-acp"
path = "src/bin/a3s-code-acp.rs"

[dependencies]
a3s-code-core = { version = "9.1.3", path = "../core", default-features = true, features = ["headless-search"] }
a3s-use-reconcile = "0.2.10"
agent-client-protocol = { version = "0.10.4", features = ["unstable"] }
anyhow = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "process", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

a3s-acl = "=0.2.2"
a3s-okf = "0.1.0"

[dev-dependencies]
tempfile = "3"
agent-client-protocol = { version = "0.10.4", features = ["unstable"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
vt100 = "0.15"
