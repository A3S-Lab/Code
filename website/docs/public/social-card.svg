<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A3S Code — Rust runtime for coding agents</title>
  <desc id="desc">Tool calls, approval, event streaming, and recovery for Rust, Node.js, and Python.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#20232a" stroke-width="1"/>
    </pattern>
    <linearGradient id="headline" x1="110" y1="185" x2="720" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f7fa"/>
      <stop offset=".55" stop-color="#8bb6ff"/>
      <stop offset="1" stop-color="#f0b44d"/>
    </linearGradient>
    <linearGradient id="blueLayer" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ca3ff"/>
      <stop offset="1" stop-color="#233a5c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0b0d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#292b31" stroke-width="2"/>

  <g transform="translate(86 78)">
