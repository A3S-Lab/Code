name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  retrieval-soak:
    name: Retrieval soak
    uses: ./.github/workflows/workspace-retrieval-soak.yml

  sdk-runtime:
    name: SDK runtime
    uses: ./.github/workflows/sdk-runtime.yml

  hermetic-integrations:
    name: Hermetic integrations
    uses: ./.github/workflows/hermetic-integrations.yml

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Verify capability evidence ledger
        run: python3 scripts/check_capability_verification.py

      - name: Test repository validation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check browser dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          minimal_tree="$(cargo tree -p a3s-code-core --no-default-features -e normal)"
          if grep -q 'chromiumoxide' <<<"$minimal_tree"; then
            echo "minimal Core must not compile the browser/CDP dependency stack" >&2
            exit 1
          fi
          default_tree="$(cargo tree -p a3s-code-core -e normal)"
          grep -q 'chromiumoxide' <<<"$default_tree"
          headless_tree="$(cargo tree -p a3s-code-core --no-default-features --features headless-search -e normal)"
          grep -q 'chromiumoxide' <<<"$headless_tree"

      - name: Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Check public API compatibility with v5.3.5
        run: |
          cargo install cargo-semver-checks --version 0.48.0 --locked
          bash scripts/check_semver.sh 5.3.5

      - name: Default tests
        run: cargo test --workspace

      - name: Feature-gated library tests
        run: cargo test --workspace --all-features --lib

      - name: Agent convergence benchmark
        run: cargo run -p a3s-code-core --example agent_convergence_benchmark

  sdk-check:
    name: SDK contract and Go runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check SDK protocol and API alignment
        run: |
          node scripts/generate_event_protocol_artifacts.mjs --check
          node scripts/sdk_api_alignment_check.mjs

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod

      - name: Check Go SDK
        run: |
          cargo build --package a3s-code-go-bridge --bin a3s-code-go-bridge
          A3S_CODE_GO_BRIDGE_TEST_BINARY="$PWD/../../target/debug/a3s-code-go-bridge" \
            go test -race ./...
        working-directory: sdk/go

  windows-check:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        shell: bash
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Library tests
        run: cargo test --workspace --lib

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod

      - name: Go SDK integration
        shell: pwsh
        working-directory: sdk/go
        run: |
          cargo build --package a3s-code-go-bridge --bin a3s-code-go-bridge
          $env:A3S_CODE_GO_BRIDGE_TEST_BINARY = (Resolve-Path "..\..\target\debug\a3s-code-go-bridge.exe").Path
          go test ./...
