name: Publish Python SDK

on:
  workflow_call:
    inputs:
      target:
        required: false
        type: string
        description: "Specific target to build (e.g., x86_64-unknown-linux-gnu). If empty, builds all targets."
  workflow_dispatch:
    inputs:
      target:
        required: false
        type: string
        description: "Specific target to build (e.g., x86_64-unknown-linux-gnu). If empty, builds all targets."

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - host: windows-latest
            target: x86_64-pc-windows-msvc

    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    # To build only a specific target, uncomment this line and set the target:
    # if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        shell: bash
        run: bash .github/setup-workspace.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install protobuf compiler
        shell: bash
        run: |
          if [ "${{ matrix.settings.host }}" = "ubuntu-latest" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "${{ matrix.settings.host }}" = "windows-latest" ]; then
            choco install protoc -y
          else
            brew install protobuf
          fi

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.settings.target }}
          args: --release --out dist --manifest-path sdk/python/Cargo.toml -i python3.10 -i python3.11 -i python3.12 -i python3.13
          manylinux: ${{ matrix.settings.manylinux || 'auto' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.settings.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-bootstrap:
    name: Build bootstrap package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bootstrap dist
        run: |
          python -m pip install --upgrade pip build
          python -m build sdk/python-bootstrap --outdir sdk/python-bootstrap/dist

      - name: Upload bootstrap dist
        uses: actions/upload-artifact@v4
        with:
          name: python-bootstrap-dist
          path: sdk/python-bootstrap/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
      - build-bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true

      - name: Download bootstrap dist
        uses: actions/download-artifact@v4
        with:
          name: python-bootstrap-dist
          path: bootstrap-dist

      - name: List wheels
        run: ls -la dist/

      - name: Generate native wheel manifest
        run: |
          python .github/scripts/generate_python_release_manifest.py \
            dist \
            dist/python-native-manifest.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Ensure release exists and upload native assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Native Python wheel assets"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/python-native-manifest.json --clobber

      - name: Publish bootstrap package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_NATIVE_TOKEN }}
        run: |
          python -m pip install --upgrade pip twine
          python -m twine upload --skip-existing bootstrap-dist/*
