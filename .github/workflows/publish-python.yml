name: Publish Python SDK

# This workflow builds native Python wheels and uploads them to GitHub
# Releases. Wheels are NOT pushed to PyPI — they grew the project past
# PyPI's default 10 GB per-project quota, so GitHub Releases is now the
# canonical wheel host. See README.md for the install command.

on:
  workflow_call:
    inputs:
      target:
        required: false
        type: string
        description: "Specific target to build (e.g., x86_64-unknown-linux-gnu). If empty, builds all targets."

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Build native wheels for each platform
  # These are uploaded to GitHub Releases, NOT to PyPI
  # ─────────────────────────────────────────────────────────────────
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            python_architecture: arm64
            zvec: true
          - host: macos-15-intel
            target: x86_64-apple-darwin
            python_architecture: x64
            zvec: false
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
            python_architecture: x64
            zvec: true
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
            python_architecture: arm64
            zvec: true
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            # The hosted ARM64 image does not provide CPython 3.10 ARM64.
            # CPython 3.13 is available natively and still produces the
            # project's cp310-abi3 wheel.
            python_version: "3.13"
            python_architecture: arm64
            zvec: false
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            python_architecture: x64
            zvec: true

    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        shell: bash
        run: bash .github/setup-workspace.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # The extension is built against the oldest supported CPython and
          # uses the stable cp310-abi3 ABI. One interpreter is sufficient for
          # the release wheel; the bootstrap's compatibility matrix is tested
          # separately in sdk/python-bootstrap/tests.
          python-version: ${{ matrix.settings.python_version || '3.10' }}
          architecture: ${{ matrix.settings.python_architecture }}

      - name: Install Rust
        # Pinned: brotli 8.0.3 (transitive via optional SDK features) fails
        # to compile on newer stable rustc; 1.94.1 is the known-good build that
        # shipped earlier releases. Revisit when the brotli/toolchain break clears.
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install protobuf compiler
        shell: bash
        run: |
          if [[ "${{ matrix.settings.host }}" == ubuntu-* ]]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [[ "${{ matrix.settings.host }}" == windows-* ]]; then
            choco install protoc -y
          else
            brew install protobuf
          fi

      - name: Set macOS Intel deployment target
        # Build on the maintained Intel runner while keeping the wheel
        # loadable on the requested macOS 12 baseline.
        if: matrix.settings.target == 'x86_64-apple-darwin'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      - name: Stage bundled Moli runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_moli.sh \
            "${{ matrix.settings.target }}" sdk/python/python/a3s_code/moli

      - name: Stage verified zvec runtime
        if: matrix.settings.zvec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sdk/python/python/a3s_code/zvec
          bash scripts/package_zvec.sh \
            "${{ matrix.settings.target }}" sdk/python/python/a3s_code/zvec
          if [[ "${{ matrix.settings.target }}" == *-windows-* ]]; then
            cp sdk/python/python/a3s_code/zvec/zvec_c_api.dll \
              sdk/python/python/a3s_code/zvec_c_api.dll
          fi
          echo "ZVEC_LIB_DIR=$PWD/sdk/python/python/a3s_code/zvec" >> "$GITHUB_ENV"
          echo "ZVEC_AUTO_BUILD=0" >> "$GITHUB_ENV"
          ZVEC_FLAGS="$(bash scripts/zvec_rustflags.sh \
            "${{ matrix.settings.target }}" zvec)"
          echo "RUSTFLAGS=$ZVEC_FLAGS" >> "$GITHUB_ENV"

      # Build native wheels - these go to GitHub Releases ONLY
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.settings.target }}
          # The SDK enables pyo3/abi3-py310, so one wheel covers CPython
          # 3.10–3.14 (and future compatible CPython 3.x releases). Build
          # against the oldest supported interpreter to keep the ABI honest;
          # the Windows ARM64 job uses its native 3.13 interpreter because
          # setup-python does not ship CPython 3.10 for that architecture.
          # Build from an explicit feature set. This prevents unsupported
          # targets from silently downloading or auto-building a foreign zvec
          # library while retaining the stable ABI extension feature.
          args: >-
            --release --out dist --manifest-path sdk/python/Cargo.toml
            --no-default-features
            --features extension-module${{ matrix.settings.zvec && ',zvec-rust-fts-bundled' || '' }}
            -i python${{ matrix.settings.python_version || '3.10' }}
          manylinux: ${{ matrix.settings.manylinux || 'auto' }}
          # Pin the toolchain maturin installs (incl. inside the manylinux
          # container) so brotli 8.0.3 compiles. See "Install Rust" note above.
          rust-toolchain: 1.94.1

      - name: Verify Intel macOS wheel tag
        if: matrix.settings.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*-cp310-abi3-macosx_12_0_x86_64.whl' >/dev/null || {
            echo "Expected a CPython ABI3 macOS 12 Intel wheel in dist/" >&2
            ls -la dist/
            exit 1
          }

      - name: Verify CPython stable-ABI wheel
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'dist/*-cp310-abi3-*.whl' >/dev/null || {
            echo "Expected a CPython 3.10 ABI3 wheel in dist/" >&2
            ls -la dist/
            exit 1
          }

      - name: Upload wheels to GitHub Releases
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.settings.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # Publish to GitHub Releases and PyPI
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish Python SDK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      # Upload native wheels to GitHub Releases — the canonical wheel host.
      - name: Ensure release exists and upload native assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Native Python wheel assets"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber

      # Generate manifest of wheel metadata (filename + sha256) so a
      # future bootstrap installer can pick the right wheel by platform.
      - name: Generate native wheel manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python .github/scripts/generate_python_release_manifest.py \
            dist \
            dist/python-native-manifest.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Upload manifest to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/python-native-manifest.json --clobber
