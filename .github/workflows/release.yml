name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  registry-preflight:
    name: Registry dependency preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test registry dependency preflight
        run: python3 -m unittest scripts.tests.test_check_publish_dependencies

      - name: Verify publish dependencies are available
        run: python3 scripts/check_publish_dependencies.py core/Cargo.toml

  retrieval-soak:
    name: Retrieval soak
    needs: registry-preflight
    uses: ./.github/workflows/workspace-retrieval-soak.yml

  sdk-runtime:
    name: SDK runtime
    needs: registry-preflight
    uses: ./.github/workflows/sdk-runtime.yml

  hermetic-integrations:
    name: Hermetic integrations
    needs: registry-preflight
    uses: ./.github/workflows/hermetic-integrations.yml

  performance:
    name: Performance qualification
    needs: registry-preflight
    uses: ./.github/workflows/performance.yml

  # ───────────────────────────────────────────────
  # Gate: CI checks must pass before any publishing
  # ───────────────────────────────────────────────
  ci:
    name: CI Checks
    needs: registry-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace context
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build and sandbox prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler bubblewrap
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Verify capability architecture and evidence
        run: |
          python3 scripts/check_scoped_capability_architecture.py
          python3 scripts/check_capability_verification.py

      - name: Test repository validation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Validate release tag and version alignment
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Release publishing requires a v* tag" >&2; exit 1 ;;
          esac
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          bash check-version.sh "$VERSION"

      - name: Check public API compatibility with v5.3.5
        run: |
          cargo install cargo-semver-checks --version 0.50.0 --locked
          bash scripts/check_semver.sh 5.3.5

      - name: Check SDK protocol and API alignment
        run: |
          node scripts/generate_event_protocol_artifacts.mjs --check
          node scripts/sdk_api_alignment_check.mjs

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod

      - name: Check Go SDK
        run: |
          cargo build --package a3s-code-go-bridge --bin a3s-code-go-bridge
          A3S_CODE_GO_BRIDGE_TEST_BINARY="$PWD/../../target/debug/a3s-code-go-bridge" \
            go test -race ./...
        working-directory: sdk/go

      - name: Reclaim build space before tests
        run: cargo clean

      - name: Default tests
        run: cargo test --workspace

      - name: Feature-gated library tests
        run: cargo test --workspace --all-features --lib

  # ───────────────────────────────────────────────
  # Windows cross-compile check
  # ───────────────────────────────────────────────
  ci-windows:
    name: CI Checks (Windows)
    needs: registry-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        shell: bash
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy (Windows)
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Tests (Windows)
        run: cargo test --workspace --lib

  # ───────────────────────────────────────────────
  # Publish a3s-code-core to crates.io
  # ───────────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    needs:
      [
        ci,
        ci-windows,
        retrieval-soak,
        sdk-runtime,
        hermetic-integrations,
        performance,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Publish a3s-code-core
        working-directory: core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if curl -fsSL "https://crates.io/api/v1/crates/a3s-code-core/${VERSION}" >/dev/null 2>&1; then
            echo "a3s-code-core ${VERSION} already exists on crates.io, skipping publish."
            exit 0
          fi
          set +e
          OUTPUT=$(cargo publish --allow-dirty 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "already (uploaded|exists)"; then
              echo "a3s-code-core ${VERSION} was already published, treating as success."
              exit 0
            fi
            exit "$STATUS"
          fi

  # ───────────────────────────────────────────────
  # Build and publish Node native SDK (reusable)
  # ───────────────────────────────────────────────
  publish-node:
    name: Node SDK
    needs: [publish-crate]
    uses: ./.github/workflows/publish-node.yml
    secrets: inherit

  # ───────────────────────────────────────────────
  # Build native Python wheels and attach to GitHub Release (reusable).
  # No longer pushes to PyPI — the per-project size cap made that
  # impractical. GH Release is the canonical wheel host.
  # ───────────────────────────────────────────────
  publish-python:
    name: Python SDK (native wheels → GH Release)
    needs: [publish-crate]
    uses: ./.github/workflows/publish-python.yml
    secrets: inherit

  # ───────────────────────────────────────────────
  # Publish the pure-Python bootstrap to PyPI so `pip install a3s-code`
  # still works. Needs the native wheels to be on GH Release first.
  # ───────────────────────────────────────────────
  publish-python-bootstrap:
    name: Python SDK (bootstrap → PyPI)
    needs: [publish-python]
    uses: ./.github/workflows/publish-python-bootstrap.yml
    secrets: inherit

  publish-go:
    name: Go SDK
    needs: [publish-crate, publish-python]
    uses: ./.github/workflows/publish-go.yml
    secrets: inherit

  # ───────────────────────────────────────────────
  # Create GitHub Release
  # ───────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs:
      [
        publish-crate,
        publish-node,
        publish-python,
        publish-python-bootstrap,
        publish-go,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            echo "Initial release" > /tmp/release-notes.md
          else
            git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty=format:"- %s" | head -50 > /tmp/release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi
