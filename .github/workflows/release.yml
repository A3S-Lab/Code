name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-out stable tag after all gates pass
        type: boolean
        default: false
      publish_sdks:
        description: Also publish the version-aligned SDKs
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: code-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  registry-preflight:
    name: Registry dependency preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test registry dependency preflight
        run: python3 -m unittest scripts.tests.test_check_publish_dependencies

      - name: Verify publish dependencies are available
        run: python3 scripts/check_publish_dependencies.py core/Cargo.toml acp/Cargo.toml --candidate-manifest core/Cargo.toml

  retrieval-soak:
    name: Retrieval soak
    needs: registry-preflight
    uses: ./.github/workflows/workspace-retrieval-soak.yml

  memory-restart-soak:
    name: Memory restart soak
    needs: registry-preflight
    uses: ./.github/workflows/durable-memory-restart-soak.yml

  sdk-runtime:
    name: SDK runtime
    needs: registry-preflight
    uses: ./.github/workflows/sdk-runtime.yml

  hermetic-integrations:
    name: Hermetic integrations
    needs: registry-preflight
    uses: ./.github/workflows/hermetic-integrations.yml

  performance:
    name: Performance qualification
    needs: registry-preflight
    uses: ./.github/workflows/performance.yml

  # ───────────────────────────────────────────────
  # Gate: CI checks must pass before any publishing
  # ───────────────────────────────────────────────
  ci:
    name: CI Checks
    needs: registry-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace context
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Relock standalone dependencies
        run: bash .github/relock-standalone-deps.sh

      - name: Install Linux build and sandbox prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler bubblewrap
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Verify capability architecture and evidence
        run: |
          python3 scripts/check_scoped_capability_architecture.py
          python3 scripts/check_capability_verification.py

      - name: Test repository validation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Rustdoc warning gate
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p a3s-code-core -p a3s-code-go-bridge --features ci-all --no-deps

      - name: Clippy
        # --features ci-all: every optional surface except Apple-only apofasi-metal.
        run: cargo clippy -p a3s-code-core -p a3s-code-go-bridge --lib --bins --features ci-all -- -D warnings

      - name: Validate release tag and version alignment
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("core/Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$PUBLISH" == true ]]; then
            test "$GITHUB_REF" = "refs/tags/v${VERSION}"
            git fetch --no-tags origin main
            git merge-base --is-ancestor HEAD origin/main
          fi
          bash check-version.sh "$VERSION"

      - name: Check public API compatibility with v9.1.2
        run: |
          cargo install cargo-semver-checks --version 0.50.0 --locked
          bash scripts/check_semver.sh 9.1.2

      - name: Check SDK protocol and API alignment
        run: |
          node scripts/generate_event_protocol_artifacts.mjs --check
          node scripts/generate_evaluation_protocol_artifacts.mjs --check
          node scripts/check_evaluation_protocol_artifacts.mjs
          node scripts/generate_research_protocol_artifacts.mjs --check
          node scripts/check_research_protocol_artifacts.mjs
          node scripts/sdk_api_alignment_check.mjs

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod

      - name: Check Go SDK
        run: |
          cargo build --package a3s-code-go-bridge --bin a3s-code-go-bridge --features advanced-harness,server
          A3S_CODE_GO_BRIDGE_TEST_BINARY="$PWD/../../target/debug/a3s-code-go-bridge" \
          RUST_MIN_STACK="${RUST_MIN_STACK:-16777216}" \
            go test -race -tags=release_contract ./...
        working-directory: sdk/go

      - name: Reclaim build space before tests
        run: cargo clean

      - name: Check out a3s-acl for the shipped pager
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/ACL
          ref: 5317e166222495585909d81f2caffdca90273c99
          path: ci-acl
          fetch-depth: 1

      - name: Build the shipped TUI
        # shipped_tui_e2e launches vendor/a3s-code-ui/target/debug/a3s-code-tui.
        # The pager path-depends on the sibling ACL crate.
        shell: bash
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/ci-acl" "$GITHUB_WORKSPACE/../acl"
          bash .github/build-shipped-tui.sh

      - name: Default tests
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --workspace

      - name: Feature-gated library tests
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test -p a3s-code-core -p a3s-code-go-bridge --features ci-all --lib

      - name: Verify Core and ACP registry packages
        run: cargo publish --locked -p a3s-code-core -p a3s-code-acp --dry-run --allow-dirty

  # ───────────────────────────────────────────────
  # Windows cross-compile check
  # ───────────────────────────────────────────────
  ci-windows:
    name: CI Checks (Windows)
    needs: registry-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        shell: bash
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Relock standalone dependencies
        run: bash .github/relock-standalone-deps.sh

      - name: Clippy (Windows)
        # --features ci-all: every optional surface except Apple-only apofasi-metal.
        run: cargo clippy -p a3s-code-core -p a3s-code-go-bridge --lib --bins --features ci-all -- -D warnings

      - name: Tests (Windows)
        # a3s-sandbox's AppContainer backend temporarily reserves DOS drive
        # mappings and mutates host ACLs. Keep the test process serial so
        # unrelated Code tests cannot race those process-global resources.
        # Go bridge / FFI tests need a larger default stack than Windows CI
        # provides; match the Linux Default tests env.
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --workspace --lib -- --test-threads=1

  build-terminal:
    name: Build ACP and terminal (${{ matrix.target }})
    needs: registry-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup workspace context
        shell: bash
        run: bash .github/setup-workspace.sh
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Relock standalone dependencies
        shell: bash
        run: bash .github/relock-standalone-deps.sh
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: A3S-Lab/ACL
          ref: 5317e166222495585909d81f2caffdca90273c99
          path: ci-acl
      - name: Build release binaries
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ln -sfn "$GITHUB_WORKSPACE/ci-acl" "$GITHUB_WORKSPACE/../acl"
          cargo build --locked --release -p a3s-code-acp --bin a3s-code-acp --target "$RELEASE_TARGET"
          bash .github/prepare-shipped-tui.sh
          cargo build --locked --release --manifest-path vendor/a3s-code-ui/Cargo.toml \
            -p a3s-code-pager-bin --bin a3s-code-tui --target "$RELEASE_TARGET"
      - name: Package and check release binaries
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("core/Cargo.toml", "rb"))["package"]["version"])')"
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          mkdir -p dist/bundle
          cp "target/$RELEASE_TARGET/release/a3s-code-acp$suffix" dist/bundle/
          cp "vendor/a3s-code-ui/target/$RELEASE_TARGET/release/a3s-code-tui$suffix" dist/bundle/
          "dist/bundle/a3s-code-acp$suffix" --version
          "dist/bundle/a3s-code-tui$suffix" --version
          if [[ "$RUNNER_OS" != Windows ]]; then
            python3 scripts/check_shipped_tui.py \
              --binary "dist/bundle/a3s-code-tui" --expected-version "$version" \
              --expected-revision "$GITHUB_SHA" > dist/bundle/startup-check.json
          fi
          asset="a3s-code-v${version}-${RELEASE_TARGET}.tar.gz"
          tar -czf "dist/$asset" -C dist/bundle .
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: code-terminal-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # No registry upload runs before the whole qualification and binary matrix.
  publish-crate:
    name: Publish Core and ACP to crates.io
    if: github.event_name == 'push' || inputs.publish
    needs:
      [
        ci,
        ci-windows,
        retrieval-soak,
        memory-restart-soak,
        sdk-runtime,
        hermetic-integrations,
        performance,
        build-terminal,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace context
        run: bash .github/setup-workspace.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Relock standalone dependencies
        run: bash .github/relock-standalone-deps.sh

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Publish Core, then ACP
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        shell: bash
        run: bash .github/publish-code-crates.sh

  # ───────────────────────────────────────────────
  # Build and publish Node native SDK (reusable)
  # ───────────────────────────────────────────────
  publish-node:
    if: inputs.publish_sdks
    name: Node SDK
    needs: [publish-crate]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-node.yml

  # ───────────────────────────────────────────────
  # Build native Python wheels and attach to GitHub Release (reusable).
  # No longer pushes to PyPI — the per-project size cap made that
  # impractical. GH Release is the canonical wheel host.
  # ───────────────────────────────────────────────
  publish-python:
    if: inputs.publish_sdks
    name: Python SDK (native wheels → GH Release)
    needs: [publish-crate]
    uses: ./.github/workflows/publish-python.yml
    secrets: inherit

  # ───────────────────────────────────────────────
  # Publish the pure-Python bootstrap to PyPI so `pip install a3s-code`
  # still works. Needs the native wheels to be on GH Release first.
  # ───────────────────────────────────────────────
  publish-python-bootstrap:
    if: inputs.publish_sdks
    name: Python SDK (bootstrap → PyPI)
    needs: [publish-python]
    uses: ./.github/workflows/publish-python-bootstrap.yml
    secrets: inherit

  publish-go:
    if: inputs.publish_sdks
    name: Go SDK
    needs: [publish-crate, publish-python]
    uses: ./.github/workflows/publish-go.yml
    secrets: inherit

  # ───────────────────────────────────────────────
  # Create GitHub Release
  # ───────────────────────────────────────────────
  github-release:
    name: GitHub Release
    if: >-
      always() && !cancelled() &&
      needs.publish-crate.result == 'success' &&
      needs.build-terminal.result == 'success' &&
      (needs.publish-node.result == 'success' || needs.publish-node.result == 'skipped') &&
      (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
      (needs.publish-python-bootstrap.result == 'success' || needs.publish-python-bootstrap.result == 'skipped') &&
      (needs.publish-go.result == 'success' || needs.publish-go.result == 'skipped')
    needs:
      [
        publish-crate,
        build-terminal,
        publish-node,
        publish-python,
        publish-python-bootstrap,
        publish-go,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: code-terminal-*
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { section = 1; next }
            section && /^## \[/ { exit }
            section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          (cd dist && cat *.sha256 > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
