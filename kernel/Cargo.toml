[package]
name = "a3s-code-kernel"
version = "9.1.1"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Code"
description = "A3S Code kernel: identity, logical clock, and domain-separated digests"

[lib]
name = "a3s_code_kernel"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
