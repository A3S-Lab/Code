[workspace]
resolver = "2"
members = [
    "core",
    "sdk/go/bridge",
]
# Native SDK crates require special toolchains (Python/Node.js)
# Build them individually: cargo build -p a3s-code-node / a3s-code-py
exclude = [
    "sdk/node",
    "sdk/python",
    "fixtures/s3-compat",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Workspace retrieval's lexical index is latency-sensitive; keep the rest of
# the distributable size-optimized while compiling the hot dependency for
# speed.
[profile.release.package.a3s-vec]
opt-level = 3

[profile.release.package.a3s-memory]
opt-level = 3

[patch."https://github.com/A3S-Lab/Sandbox.git"]
a3s-sandbox = { path = "../sandbox" }

[patch."https://github.com/A3S-Lab/Apofasi.git"]
a3s-apofasi = { path = "../apofasi" }

[patch.crates-io]
a3s-vec = { path = "../vec" }
