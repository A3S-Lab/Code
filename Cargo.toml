[workspace]
resolver = "2"
members = [
    "core"
]
# Native SDK crates require special toolchains (Python/Node.js)
# Build them individually: cargo build -p a3s-code-node / a3s-code-py
exclude = [
    "sdk/node",
    "sdk/python",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
