[package]
license = "Apache-2.0"
name = "a3s-code-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
a3s-code-hooks = { path = "../a3s-code-hooks" }
a3s-code-sampling-types = { path = "../a3s-code-sampling-types" }
a3s-code-telemetry = { workspace = true }
a3s-code-tools = { path = "../a3s-code-tools" }
a3s-tty-utils = { workspace = true }
a3s-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
ignore = { workspace = true }
a3s-code-config = { workspace = true }
a3s-dirs = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
a3s-tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
