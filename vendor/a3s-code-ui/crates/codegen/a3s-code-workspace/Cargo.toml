[package]
license = "Apache-2.0"
name = "a3s-code-workspace"
version = "0.1.220-alpha.4"
edition.workspace = true
description = "Core host-local workspace library (FS, VCS, execution, discovery) for a3s-code-shell and remote sampler"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
dunce = { workspace = true }
a3s-code-version = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
parking_lot = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
a3s-code-agent = { path = "../a3s-code-agent" }
a3s-code-tools = { path = "../a3s-code-tools" }
a3s-code-tools-api = { path = "../a3s-code-tools-api" }
# `DiagHandle`, held by the hub config and threaded through `connect_hub`.
a3s-code-diag-server = { workspace = true }
a3s-code-workspace-client = { path = "../a3s-code-workspace-client" }
# Daemon/process-lifecycle machinery for `bin/workspace_server.rs` only; the
# library never references it.
a3s-code-workspace-daemon = { path = "../a3s-code-workspace-daemon" }
a3s-code-workspace-types = { path = "../a3s-code-workspace-types" }
a3s-code-config = { workspace = true }
a3s-dirs = { workspace = true }
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
a3s-code-config-types = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
dashmap = { workspace = true }
agent-client-protocol = { workspace = true }
a3s-acp-lib = { workspace = true }
a3s-codebase-graph = { path = "../a3s-codebase-graph" }
a3s-code-paths = { path = "../a3s-code-paths" }
base64 = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true, features = ["force-soft"] }
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
# Backs `file_system`'s fuzzy path picker (matcher + background daemon).
a3s-fuzzy-file-search = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
chrono = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = "0.25"
url = { workspace = true }
a3s-code-env = { workspace = true }
humantime-serde = { workspace = true }
prometheus = { workspace = true }
glob = "0.3"
a3s-code-sandbox = { path = "../a3s-code-sandbox", default-features = false }
a3s-code-hooks = { path = "../a3s-code-hooks" }
a3s-hunk-tracker = { path = "../a3s-hunk-tracker" }
# `metrics` enables the SDK's metric-donation client (periodic Prometheus
# registry gather → OTLP → hub donation pump); see metric_donation_reporter.
a3s-computer-hub-sdk = { workspace = true, features = ["metrics"] }
a3s-computer-hub-mcp-adapter = { path = "../../common/a3s-computer-hub-mcp-adapter" }
a3s-code-mcp = { path = "../a3s-code-mcp" }
a3s-file-utils = { path = "../a3s-file-utils" }
a3s-code-session-events = { workspace = true }
a3s-code-auth = { path = "../a3s-code-auth" }
a3s-code-telemetry = { workspace = true }
a3s-tty-utils = { workspace = true }
reqwest = { workspace = true }
a3s-tool-protocol = { workspace = true }
a3s-tool-runtime = { workspace = true }
a3s-tool-types = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
urlencoding = "2"
a3s-fast-worktree = { path = "../a3s-fast-worktree", features = ["metadata"] }
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = { workspace = true }
sha1 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

a3s-fsnotify = { path = "../a3s-fsnotify" }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# "enable" required for the SDK's spans to record at all.
fastrace = { workspace = true, features = ["enable"] }
a3s-tracing = { workspace = true }
a3s-code-extra-ca = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tempfile = { workspace = true }
zstd = { workspace = true }
wait-timeout = { workspace = true }

# Raw fd/dirent/poll calls in foreign-session capability probes, the fuzzy
# walker's rlimit guard, and the envrc reader.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[[bin]]
name = "a3s-workspace-server"
path = "src/bin/workspace_server.rs"

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
test-util = []
sandbox-enforce = ["a3s-code-sandbox/enforce"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
a3s-test-utils = { path = "../../common/a3s-test-utils" }
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = { workspace = true }
tar = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
