[package]
license = "Apache-2.0"
name = "a3s-code-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Shared subagent definition, runtime, prompt, and resume resolution"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
a3s-code-agent = { path = "../a3s-code-agent" }
a3s-code-sampling-types = { path = "../a3s-code-sampling-types" }
a3s-code-tools = { path = "../a3s-code-tools" }
a3s-tool-types.workspace = true

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }

[lints]
workspace = true
