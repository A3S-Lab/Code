[package]
license = "Apache-2.0"
name = "a3s-code-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the A3S sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
a3s-circuit-breaker = { workspace = true }
a3s-code-compaction = { path = "../../common/a3s-code-compaction" }
a3s-tool-types = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
