[package]
name = "a3s-code-pager-bin"
version = "9.1.1"
edition.workspace = true
license = "Apache-2.0"
authors = ["A3S Lab"]
default-run = "a3s-code-tui"

# Composition-root binary for the A3S Code TUI. The artifact is still named
# `a3s-code-pager`. This package exists so the binary can link both the pager
# library and the optional `a3s-code-pager-minimal` render mode: `minimal`
# depends on `a3s-code-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
[[bin]]
name = "a3s-code-tui"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
a3s-code-pager = { path = "../a3s-code-pager" }
# Optional scrollback-native render mode, wired in via the fn-pointer seam.
a3s-code-pager-minimal = { path = "../a3s-code-pager-minimal" }

# Agent runtime + leader/stdio/headless entry points.
a3s-code-login = { workspace = true }
a3s-code-shell = { workspace = true }
a3s-code-update = { path = "../a3s-code-update" }
a3s-code-version = { workspace = true }
a3s-code-telemetry = { workspace = true }
a3s-code-workspace = { workspace = true }
a3s-crash-handler = { path = "../a3s-crash-handler" }
a3s-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
semver = { workspace = true }
a3s-tty-utils = { workspace = true }
a3s-code-config = { workspace = true }
a3s-code-sandbox = { path = "../a3s-code-sandbox", default-features = false }
a3s-code-extra-ca = { workspace = true }

# Binary hardening: compile-time string + control-flow obfuscation.
obfstr = { workspace = true }
cryptify = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = { workspace = true, optional = true, features = ["stats"] }
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = { workspace = true, optional = true }
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = { workspace = true, optional = true, features = ["stats", "use_std"] }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
# a3s-code-workspace no longer enables sandbox-enforce by default, so enable it here.
sandbox-enforce = ["a3s-code-pager/sandbox-enforce", "a3s-code-workspace/sandbox-enforce"]
local-workspace = ["a3s-code-pager/local-workspace"]
# Test-only, prod-inert seam: lets the e2e harness install a TEST-signed managed-policy key the
# spawned pager trusts. Double locked out of production: absent from `default`, `default-bazel`, and
# `release-dist`, and the install hook is additionally gated on `debug_assertions` (off in shipped
# `-c opt`/release builds). Never add this to a shipped feature set.
test-seams = []
release-dist = [
    "a3s-code-pager/release-dist",
    ]
