[package]
license = "Apache-2.0"
name = "a3s-code-session-search"
version = "0.1.0"
edition.workspace = true
description = "SQLite FTS5 index over local grok sessions: lease-guarded bootstrap, debounced incremental upserts, and BM25 ranked query"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
parking_lot = { workspace = true }
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
# Pinned to 0.32 elsewhere resolved CVE-2025-29087, CVE-2025-3277,
# CVE-2025-6965; keep this in step with a3s-sqlite-journal.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
a3s-code-config = { workspace = true }
a3s-code-telemetry = { workspace = true }
a3s-sqlite-journal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
