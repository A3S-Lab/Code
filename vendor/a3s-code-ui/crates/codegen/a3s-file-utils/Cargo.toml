[package]
license = "Apache-2.0"
name = "a3s-file-utils"
version = "0.1.0"
edition.workspace = true
description = "Local data collection: upload queueing and blob storage"
authors = ["A3S Lab"]

[dependencies]
anyhow = { workspace = true }
base64.workspace = true
dunce = { workspace = true }
a3s-circuit-breaker = { workspace = true }
a3s-code-version = { workspace = true }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
] }
aws-config = { version = "1", default-features = false, features = [
    "rt-tokio",
    "sso",
    "credentials-process",
] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
indexmap = { workspace = true }
a3s-dirs = { workspace = true }
reqwest = { workspace = true }
a3s-code-extra-ca = { workspace = true }
reqwest-middleware = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "fs"] }
sha2 = { workspace = true, features = ["force-soft"] }
a3s-code-auth = { path = "../a3s-code-auth", features = ["middleware"] }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
async-compression = { workspace = true, features = ["tokio"] }
gcloud-storage = { workspace = true }
reflink-copy = { workspace = true }
a3s-code-otel = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
zstd.workspace = true


[features]
default-bazel = []


[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
axum-server = { workspace = true, features = ["tls-rustls"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "net", "time"] }
a3s-test-utils = { workspace = true }
filetime = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
