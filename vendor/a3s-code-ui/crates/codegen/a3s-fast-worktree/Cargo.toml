[package]
license = "Apache-2.0"
name = "a3s-fast-worktree"
version = "0.1.0"
edition.workspace = true
description = "High-performance git worktree creation using CoW cloning"

[[bin]]
name = "fast-worktree"
path = "src/bin/cli.rs"

[[bin]]
name = "pool-perf-bench"
path = "src/bin/pool_perf_bench.rs"
required-features = ["bench"]
[[bin]]
name = "worktree-lifecycle-bench"
path = "src/bin/worktree_lifecycle_bench.rs"
required-features = ["lifecycle-bench"]

[features]
default-bazel = ["metadata"]
bench = []
lifecycle-bench = [
    "metadata",
    "dep:sha2",
    "dep:url",
    "dep:uuid",
]
# SQLite metadata DB for worktree tracking.
metadata = ["dep:rusqlite", "dep:a3s-sqlite-journal"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
crossbeam = { workspace = true }
dashmap = { workspace = true }
dunce = { workspace = true }
a3s-dirs = { workspace = true }
gix = { workspace = true, features = ["status", "parallel"] }
gix-status = { version = "0.30.0" }
globset = { workspace = true }
ignore = { workspace = true }
libc = { workspace = true }
num_cpus = { workspace = true }

reflink-copy = { workspace = true }
rapidhash = "4.2.0"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
sha2 = { workspace = true, optional = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
a3s-gix-status = { workspace = true }
a3s-sqlite-journal = { workspace = true, optional = true }
a3s-tty-utils = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
a3s-test-utils = { workspace = true }
# Unconditional because cargo doesn't support feature-gated dev-deps cleanly.
# Only used by tests behind #[cfg(feature = "metadata")] in db/tests.rs.
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.30", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
