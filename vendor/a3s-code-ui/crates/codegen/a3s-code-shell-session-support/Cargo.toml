[package]
license = "Apache-2.0"
name = "a3s-code-shell-session-support"
version = "0.1.0"
edition.workspace = true
description = "Session-support modules for the grok shell crate family: managed MCP gateway catalog/call caching and file-access tracking."

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tracing = { workspace = true }
a3s-file-utils = { path = "../a3s-file-utils", optional = true }
a3s-code-http = { workspace = true }
a3s-code-version = { workspace = true }

[features]
default-bazel = []

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

[lints]
workspace = true
