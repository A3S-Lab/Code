[package]
license = "Apache-2.0"
name = "a3s-code-active-sessions"
version = "0.1.0"
edition.workspace = true
description = "Registry of open TUI sessions in a lock-guarded JSON file under the grok home"

[dependencies]
# `SessionId`, the key each registry entry is filed under.
agent-client-protocol = { workspace = true }
# `opened_at` timestamps.
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `grok_home()` supplies the directory the registry file lives in.
a3s-code-config = { workspace = true }

# `kill(pid, 0)` liveness probe for the dead-PID prune in `register`.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `OpenProcess` liveness probe for the dead-PID prune in `register`.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
