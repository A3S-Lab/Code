[package]
license = "Apache-2.0"
name = "a3s-code-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
reqwest-middleware = { workspace = true }
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
a3s-code-auth = { workspace = true, features = ["middleware"] }
a3s-code-extra-ca = { workspace = true }
a3s-code-sampler = { path = "../a3s-code-sampler" }
a3s-code-telemetry = { workspace = true }
a3s-code-version = { workspace = true }
a3s-code-workspace = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
