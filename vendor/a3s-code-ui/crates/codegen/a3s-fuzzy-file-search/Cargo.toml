[package]
license = "Apache-2.0"
name = "a3s-fuzzy-file-search"
version = "0.1.0"
edition.workspace = true
description = "Fuzzy file search over a directory tree: an ignore-aware walker feeding a nucleo matcher, plus a background daemon"

[dependencies]
# Gitignore-aware directory walking that feeds the matcher.
ignore = { workspace = true }
# The fuzzy matcher itself, plus the `Utf32String` paths carry.
nucleo = { workspace = true }
# `FuzzyMatchResult` serializes into the search-status wire payload.
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# The thread-exhaustion regression test caps `RLIMIT_NPROC` in a re-exec'd
# child, so it is Unix only.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
a3s-tty-utils = { workspace = true }

[lints]
workspace = true
