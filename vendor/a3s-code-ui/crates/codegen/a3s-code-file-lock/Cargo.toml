[package]
license = "Apache-2.0"
name = "a3s-code-file-lock"
version = "0.1.0"
edition.workspace = true
description = "Bounded non-blocking advisory file locks for grok-home files, taken behind a machine-local acquire slot so a stalled network filesystem wedges at most one process per lock path"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# `geteuid` for the slot-dir ownership check and `O_NOFOLLOW` for the slot file open.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Interop test: an fs2 flock and a std flock on the same file must exclude each other.
fs2 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
